<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline (test fixture)</title>
<style>
  body { margin:0; background:#000; color:#e7e9ea; font:15px/1.4 system-ui, sans-serif; }
  main { max-width:600px; margin:0 auto; border-left:1px solid #2f3336; border-right:1px solid #2f3336; }
  article { display:block; padding:12px 16px; border-bottom:1px solid #2f3336; }
  a { color:#71767b; text-decoration:none; }
  [role=menu] { position:fixed; right:40px; top:40px; background:#000; border:1px solid #2f3336; border-radius:12px; z-index:5000; }
  [role=menuitem] { padding:10px 16px; cursor:pointer; }
</style>
</head>
<body>
<main id="timeline"></main>
<script>
  window.__notInterested = [];
  const timeline = document.getElementById('timeline');
  function post({ id, user, body, locked, bare, quoted }) {
    const art = document.createElement('article');
    if (!bare) art.dataset.testid = 'tweet';
    const name = document.createElement('div'); name.dataset.testid = 'User-Name'; name.textContent = user + ' @' + user;
    if (locked) { const lock = document.createElement('span'); lock.dataset.testid = 'icon-lock'; lock.textContent = '🔒'; name.append(lock); }
    const when = document.createElement('a'); when.href = `/${user}/status/${id}`;
    when.addEventListener('click', e => e.preventDefault());
    if (bare) when.textContent = '2h'; else { const t = document.createElement('time'); t.textContent = '2h'; when.append(t); }
    const text = document.createElement('div'); if (!bare) text.dataset.testid = 'tweetText'; text.textContent = body;
    const caret = document.createElement('button'); caret.dataset.testid = 'caret'; caret.setAttribute('aria-label', 'More'); caret.textContent = '…';
    caret.addEventListener('click', () => {
      document.querySelector('[role=menu]')?.remove();
      const menu = document.createElement('div'); menu.setAttribute('role', 'menu');
      for (const label of ['Not interested in this post', 'Mute @' + user, 'Block @' + user]) {
        const item = document.createElement('div'); item.setAttribute('role', 'menuitem'); item.textContent = label;
        item.addEventListener('click', () => { menu.remove(); if (label.startsWith('Not interested')) window.__notInterested.push(id); else window.__wrongMenu = label; });
        menu.append(item);
      }
      document.body.append(menu);
    });
    art.append(name, when, text, caret);
    if (quoted) { const q = document.createElement('article'); q.dataset.testid = 'tweet'; const qa = document.createElement('a'); qa.href = '/other/status/999'; qa.append(document.createElement('time')); const qt = document.createElement('div'); qt.dataset.testid = 'tweetText'; qt.textContent = 'quoted BAD text'; q.append(qa, qt); art.append(q); }
    timeline.append(art);
  }
  [
    { id: '101', user: 'mathgrid', body: 'New paper: a GOOD proof sketch of the result, with figures.' },
    { id: '102', user: 'ragebait', body: 'You will not BELIEVE what this BAD person said. Thread.' },
    { id: '103', user: 'privateperson', body: 'A protected GOOD post about my family.', locked: true },
    { id: '104', user: 'newlayout', body: 'Bare article layout with BAD engagement bait.', bare: true },
    { id: '105', user: 'quoter', body: 'A GOOD comment on this:', quoted: true },
    { id: '106', user: 'NeverGuy', body: 'Something GOOD from a muted source.' },
    { id: '107', user: 'alwaysgal', body: 'Something BAD-looking from a trusted source.' },
  ].forEach(post);
  window.__go = path => { history.pushState({}, '', path); timeline.append(document.createComment('nav')); };
</script>
</body>
</html>
